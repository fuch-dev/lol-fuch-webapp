<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MiLogo</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      
      <div class="search-container ms-auto">
        <form class="d-flex" role="search" (submit)="$event.preventDefault()">
          <input class="form-control" 
                 type="search" 
                 placeholder="Buscar..." 
                 aria-label="Search"
                 [(ngModel)]="searchTerm"
                 name="searchTerm"
                 (input)="onSearchTermChanged(searchTerm)">
          </form>

        <ul class="dropdown-menu" [class.show]="searchResults.length > 0">
          <li *ngFor="let result of searchResults">
            <a class="dropdown-item" href="#" (click)="selectResult(result)">
              {{ result }}
            </a>
          </li>
        </ul>
      </div>

    </div>
  </div>
</nav>
